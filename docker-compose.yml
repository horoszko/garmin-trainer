services:
  open-webui:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: garmin-trainer-webui

    ports:
      - "3000:8080"

    environment:
      # GarminDB stores HealthData below the process home directory.
      # Keep that directory on the project bind mount so user data is portable.
      HOME: /data/garmindb
      WEBUI_SECRET_KEY_FILE: /app/backend/data/.webui_secret_key
      WEBUI_ADMIN_EMAIL: ${WEBUI_ADMIN_EMAIL}
      WEBUI_ADMIN_PASSWORD: ${WEBUI_ADMIN_PASSWORD}
      WEBUI_ADMIN_NAME: ${WEBUI_ADMIN_NAME:-Administrator}

    volumes:
      - openwebui-data:/app/backend/data
      - ./data/garmindb:/data/garmindb
      - ./data/training_diary:/data/training_diary
      - ./data/generated:/data/generated
      - ./data/knowledge:/data/knowledge

    restart: unless-stopped


volumes:
  openwebui-data:
